name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Le paquet legacy 'tools' (défaut de l'action) n'existe plus dans le dépôt SDK.
          packages: ''

      - name: Install Android compile SDK
        run: sdkmanager 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Run JVM tests, lint and debug build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest -q
