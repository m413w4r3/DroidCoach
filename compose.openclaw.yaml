services:
  atlas-core:
    environment:
      ATLAS_AGENT_ADAPTER: openclaw
      OPENCLAW_BASE_URL: http://127.0.0.1:18789
      OPENCLAW_AGENT_ID: atlas
      OPENCLAW_TIMEOUT_S: "30"
      # Total V4 turn budget for the sequential plan-tool round. Historical
      # default is 20 s; this personal deployment uses 40 s, still below the
      # Android relay timeout. Set to "20" or remove to roll back.
      ATLAS_CHAT_V4_DEADLINE_S: "40"
      # Personal ATLAS Core: keep token accounting, but do not let the local
      # daily ceiling alone block the Coach. Set to "true" (or remove) to
      # restore the historical hard stop; see docs/operations/V7-08_QUOTA_POLICY.md.
      ATLAS_AGENT_DAILY_TOKENS_ENFORCED: "false"
      ATLAS_V4_CAPABILITIES_JSON: '{"day_plan.read":true,"activity_status.read":true,"plan_revision.propose":true,"usage_summary.read":true,"goal_progress.read":true,"training_plan.read":true,"coach.chat":true}'
    secrets:
      - openclaw_gateway_token

secrets:
  openclaw_gateway_token:
    file: ${OPENCLAW_GATEWAY_TOKEN_FILE:?Set_OPENCLAW_GATEWAY_TOKEN_FILE_before_running_compose}
